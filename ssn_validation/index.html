<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSN Form Validation</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      color: #202a35;
      background: #eef3f5;
    }

    * { box-sizing: border-box; }

    body { margin: 0; padding: 40px 20px; }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border: 1px solid #d7e0e4;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgb(25 52 65 / 8%);
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #526471; line-height: 1.5; }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    input, select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #aebdc5;
      border-radius: 4px;
      background: #fff;
      color: inherit;
      font: inherit;
    }

    input:focus, select:focus { outline: 2px solid #16839a; outline-offset: 1px; }
    .wide, .actions, #status { grid-column: 1 / -1; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 400;
    }

    .checkbox-label input { width: 18px; min-height: 18px; margin: 0; }

    button {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 4px;
      background: #126b78;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #0d5964; }
    #status { min-height: 1.5em; margin: 0; }

    @media (max-width: 540px) {
      body { padding: 20px 12px; }
      main { padding: 22px 18px; }
      form { grid-template-columns: 1fr; }
      .wide, .actions, #status { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SSN Form Validation</h1>
    <p>Enter the requested information to validate the form locally. No data is sent or stored.</p>

    <form id="ssn-form">
      <label for="first-name">First name</label>
      <input id="first-name" name="first_name" type="text" autocomplete="given-name" required>

      <label for="last-name">Last name</label>
      <input id="last-name" name="last_name" type="text" autocomplete="family-name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" required>

      <label for="date-of-birth">Date of birth</label>
      <input id="date-of-birth" name="date_of_birth" type="date" required>

      <label for="ssn">Social Security Number (SSN)</label>
      <input
        id="ssn"
        name="ssn"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="123-45-6789"
        pattern="(?!000|666|9[0-9]{2})[0-9]{3}-(?!00)[0-9]{2}-(?!0000)[0-9]{4}"
        title="Use NNN-NN-NNNN; area, group, and serial numbers cannot be all zero, and area 666 or 900-999 is not allowed."
        maxlength="11"
        required
      >

      <label class="wide" for="address">Street address</label>
      <input class="wide" id="address" name="address" type="text" autocomplete="street-address" required>

      <label for="city">City</label>
      <input id="city" name="city" type="text" autocomplete="address-level2" required>

      <label for="state">State</label>
      <input id="state" name="state" type="text" autocomplete="address-level1" required>

      <label for="postal-code">ZIP / Postal code</label>
      <input id="postal-code" name="postal_code" type="text" autocomplete="postal-code" required>

      <label for="country">Country</label>
      <select id="country" name="country" autocomplete="country-name" required>
        <option value="">Choose a country</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
      </select>

      <label class="checkbox-label wide" for="consent">
        <input id="consent" name="consent" type="checkbox" required>
        I confirm this is synthetic test data.
      </label>

      <div class="actions">
        <button type="submit">Validate form</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector('#ssn-form');
    const status = document.querySelector('#status');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      status.textContent = 'Form data is valid. Nothing was submitted or stored.';
    });
  </script>
</body>
</html>
